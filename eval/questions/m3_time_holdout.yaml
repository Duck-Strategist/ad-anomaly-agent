- id: TH10
  category: time
  source: gemini A10
  user_id: u_admin
  question: 美国店上个月的广告花费和 ROAS，按自然周拆开给我发一下。
  expect: rows
  # 按周一标周；首尾两周只统计 10 月内的日期（9-28 周只含 10-01~10-04，10-26 周含 10-26~10-31）
  gold_sql: |
    SELECT date_trunc('week', s.stat_date)::date AS week,
           SUM(s.spend) AS ad_spend, SUM(s.ad_sales) / SUM(s.spend) AS roas
    FROM ad_daily_stats s
    JOIN ad_groups g ON g.ad_group_id = s.ad_group_id
    JOIN ad_campaigns c ON c.campaign_id = g.campaign_id
    WHERE c.shop_id = 'US' AND s.stat_date BETWEEN '2026-10-01' AND '2026-10-31'
    GROUP BY week
  reference_mql: {metrics: [ad_spend, roas], dimensions: [week], filters: {shop: [US]}, time: {range: calendar, unit: month, offset: -1}}

