  source: gemini B1
  user_id: u_admin
  question: 帮我算下日本店今年第三季度扣除退款后的订单金额，折算成美元是多少？
  expect: rows
  gold_sql: |
    WITH l AS (
      SELECT oi.qty * oi.unit_price * fx.rate_to_usd AS amt,
             (SELECT COALESCE(SUM(r.amount), 0) FROM refunds r WHERE r.item_id = oi.item_id) * fx.rate_to_usd AS ref
      FROM orders o
      JOIN order_items oi ON oi.order_id = o.order_id
      JOIN fx_rates fx ON fx.currency = 'JPY' AND fx.rate_date = (o.created_at AT TIME ZONE 'Asia/Tokyo')::date
      WHERE o.shop_id = 'JP' AND o.deleted_at IS NULL
        AND (o.created_at AT TIME ZONE 'Asia/Tokyo')::date BETWEEN '2026-07-01' AND '2026-09-30')
    SELECT SUM(amt) - SUM(ref) AS net_sales FROM l
  reference_mql: {metrics: [net_sales], filters: {shop: [JP]}, time: {range: custom, start: 2026-07-01, end: 2026-09-30}}

- id: TH22
  category: time_partial
  source: gemini B3
  user_id: u_ops_uk
  question: 请问英国店今年下半年到今天为止，全店累计订单数和退款金额各是多少？
  expect: rows
  gold_sql: |
    SELECT COUNT(DISTINCT o.order_id) AS order_count,
           SUM((SELECT COALESCE(SUM(r.amount), 0) FROM refunds r WHERE r.item_id = oi.item_id) * fx.rate_to_usd) AS refund_amount
    FROM orders o
    JOIN order_items oi ON oi.order_id = o.order_id
    JOIN fx_rates fx ON fx.currency = 'GBP' AND fx.rate_date = (o.created_at AT TIME ZONE 'Europe/London')::date
    WHERE o.shop_id = 'UK' AND o.deleted_at IS NULL
      AND (o.created_at AT TIME ZONE 'Europe/London')::date BETWEEN '2026-07-01' AND '2026-11-08'
  reference_mql: {metrics: [order_count, refund_amount], filters: {shop: [UK]}, time: {range: custom, start: 2026-07-01, end: 2026-11-08}}

