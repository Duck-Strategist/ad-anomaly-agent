    SELECT (o.created_at AT TIME ZONE 'America/Los_Angeles')::date AS d,
           COUNT(DISTINCT o.order_id) AS order_count,
           SUM(oi.qty * oi.unit_price) / COUNT(DISTINCT o.order_id) AS aov
    FROM orders o
    JOIN order_items oi ON oi.order_id = o.order_id
    WHERE o.shop_id = 'US' AND o.deleted_at IS NULL AND oi.sku_id = 'US-SKU03'
