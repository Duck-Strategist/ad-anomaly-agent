# M3 相对时间留出集（25 道）：相对时间 20（TH01–TH20）、部分有数据 2（TH21–TH22）、完全没有数据 3（TH23–TH25）
#
# 用途：相对时间的修复（SPEC Q19，MQL 增加 calendar）是看了 M2 全集里千问失败的 S15、S19、C19 之后设计的，
#       在原题上复测会偏高。本文件在修复代码提交之前写好 gold 并冻结；修复期间不在这些题上跑模型，修复完成后只跑一次。
# 来源：问法由 Gemini 按 eval/question_brief_time.md 生成（原始输出 eval/question_sources/gemini_2026-11-14_time.txt），
#       用户挑选：删 B2（"大上个月"有两种理解），A8 去掉"按英镑算就行"（系统只按美元报告）；其余原样。source 对应原始编号。
# 字段：同 m2_query.yaml。expect: no_data 表示必须回答"没有这个时间段的数据"（判分见 eval/run.py）。
#
# 金额统一折合美元：广告侧按 stat_date 当天汇率，订单侧（含退款）按订单的店铺本地下单日汇率。
# "今天" = 2026-11-08（周日），数据从 2026-08-11 开始。
#   昨天 11-07；前天 11-06；大前天 11-05；本周 11-02..11-08；上上周 10-19..10-25；三周前那一周 10-12..10-18；
#   本月 11-01..11-08；上个月 10-01..10-31；上上个月 09-01..09-30。
# gold 独立手写（不经编译器）；reference_mql 只给 check_reference 核对用，不给模型看。
#
# 审核状态：AI 起草，待人工审核

# ============================== 相对时间 ==============================
- id: TH01
  category: time
  source: gemini A1
  user_id: u_admin
  question: 帮我看下日本店昨天的订单金额和广告花费，都折算成美元报给我。
  expect: rows
  gold_sql: |
    SELECT
      (SELECT SUM(oi.qty * oi.unit_price * fx.rate_to_usd)
       FROM orders o
       JOIN order_items oi ON oi.order_id = o.order_id
       JOIN fx_rates fx ON fx.currency = 'JPY' AND fx.rate_date = (o.created_at AT TIME ZONE 'Asia/Tokyo')::date
       WHERE o.shop_id = 'JP' AND o.deleted_at IS NULL
         AND (o.created_at AT TIME ZONE 'Asia/Tokyo')::date = '2026-11-07') AS gross_sales,
      (SELECT SUM(s.spend * fx.rate_to_usd)
       FROM ad_daily_stats s
       JOIN ad_groups g ON g.ad_group_id = s.ad_group_id
       JOIN ad_campaigns c ON c.campaign_id = g.campaign_id
       JOIN fx_rates fx ON fx.currency = 'JPY' AND fx.rate_date = s.stat_date
       WHERE c.shop_id = 'JP' AND s.stat_date = '2026-11-07') AS ad_spend
  reference_mql: {metrics: [gross_sales, ad_spend], filters: {shop: [JP]}, time: {range: calendar, unit: day, offset: -1}}

- id: TH02
  category: time
  source: gemini A2
  user_id: u_ops_us
  question: 麻烦查一下美国店前天一共出了多少单，订单金额是多少？
  expect: rows
  gold_sql: |
    SELECT COUNT(DISTINCT o.order_id) AS order_count, SUM(oi.qty * oi.unit_price) AS gross_sales
    FROM orders o
    JOIN order_items oi ON oi.order_id = o.order_id
    WHERE o.shop_id = 'US' AND o.deleted_at IS NULL
      AND (o.created_at AT TIME ZONE 'America/Los_Angeles')::date = '2026-11-06'
  reference_mql: {metrics: [order_count, gross_sales], filters: {shop: [US]}, time: {range: calendar, unit: day, offset: -2}}

- id: TH03
  category: time
  source: gemini A3
  user_id: u_ops_us
  question: 大前天我们美国店 10 个广告组里面，哪个组的 ACOS 最高？具体数值是多少？
  expect: rows
  gold_sql: |
    SELECT s.ad_group_id, SUM(s.spend) / SUM(s.ad_sales) AS acos
    FROM ad_daily_stats s
    JOIN ad_groups g ON g.ad_group_id = s.ad_group_id
    JOIN ad_campaigns c ON c.campaign_id = g.campaign_id
    WHERE c.shop_id = 'US' AND s.stat_date = '2026-11-05'
    GROUP BY s.ad_group_id
    ORDER BY acos DESC
    LIMIT 1
  reference_mql: {metrics: [acos], dimensions: [ad_group], filters: {shop: [US]}, time: {range: calendar, unit: day, offset: -3}, order_by: {metric: acos, desc: true}, limit: 1}

- id: TH04
  category: time
  source: gemini A4
  user_id: u_ops_uk
  question: 英国店这周到今天为止每天的广告花费和广告带来的销售额，按天拆开拉给我看看。
  expect: rows
  gold_sql: |
    SELECT s.stat_date, SUM(s.spend * fx.rate_to_usd) AS ad_spend, SUM(s.ad_sales * fx.rate_to_usd) AS ad_sales
    FROM ad_daily_stats s
    JOIN ad_groups g ON g.ad_group_id = s.ad_group_id
    JOIN ad_campaigns c ON c.campaign_id = g.campaign_id
    JOIN fx_rates fx ON fx.currency = 'GBP' AND fx.rate_date = s.stat_date
    WHERE c.shop_id = 'UK' AND s.stat_date BETWEEN '2026-11-02' AND '2026-11-08'
    GROUP BY s.stat_date
  reference_mql: {metrics: [ad_spend, ad_sales], dimensions: [date], filters: {shop: [UK]}, time: {range: calendar, unit: week, offset: 0}}

- id: TH05
  category: time
  source: gemini A5
  user_id: u_admin
  question: 把三家店上上周扣除退款后的订单金额汇总在一起，按天拆开看每天分别是多少美元。
  expect: rows
  gold_sql: |
    WITH l AS (
      SELECT (o.created_at AT TIME ZONE sh.timezone)::date AS d,
             oi.qty * oi.unit_price * fx.rate_to_usd AS amt,
             (SELECT COALESCE(SUM(r.amount), 0) FROM refunds r WHERE r.item_id = oi.item_id) * fx.rate_to_usd AS ref
      FROM orders o
      JOIN shops sh ON sh.shop_id = o.shop_id
      JOIN order_items oi ON oi.order_id = o.order_id
      JOIN fx_rates fx ON fx.currency = sh.currency AND fx.rate_date = (o.created_at AT TIME ZONE sh.timezone)::date
      WHERE o.deleted_at IS NULL
        AND (o.created_at AT TIME ZONE sh.timezone)::date BETWEEN '2026-10-19' AND '2026-10-25')
    SELECT d, SUM(amt) - SUM(ref) AS net_sales
    FROM l GROUP BY d
  reference_mql: {metrics: [net_sales], dimensions: [date], time: {range: calendar, unit: week, offset: -2}}

- id: TH06
  category: time
  source: gemini A6
  user_id: u_admin
  question: 日本店三周前那一周投了广告的 10 个商品中，哪个商品广告带来的销售额最低？
  expect: rows
  gold_sql: |
    SELECT g.sku_id, SUM(s.ad_sales * fx.rate_to_usd) AS ad_sales
    FROM ad_daily_stats s
    JOIN ad_groups g ON g.ad_group_id = s.ad_group_id
    JOIN ad_campaigns c ON c.campaign_id = g.campaign_id
    JOIN fx_rates fx ON fx.currency = 'JPY' AND fx.rate_date = s.stat_date
    WHERE c.shop_id = 'JP' AND s.stat_date BETWEEN '2026-10-12' AND '2026-10-18'
    GROUP BY g.sku_id
    ORDER BY ad_sales ASC
    LIMIT 1
  # 1 个广告组只推 1 个商品（SPEC 语义层），按广告组回答 JP-AG01 指的是同一个对象，也接受（运行前决定）
  gold_sql_alt:
    - kind: shape
      key_aliases: {JP-SKU01: [JP-AG01]}
      sql: |
        SELECT g.sku_id, SUM(s.ad_sales * fx.rate_to_usd) AS ad_sales
        FROM ad_daily_stats s
        JOIN ad_groups g ON g.ad_group_id = s.ad_group_id
        JOIN ad_campaigns c ON c.campaign_id = g.campaign_id
        JOIN fx_rates fx ON fx.currency = 'JPY' AND fx.rate_date = s.stat_date
        WHERE c.shop_id = 'JP' AND s.stat_date BETWEEN '2026-10-12' AND '2026-10-18'
        GROUP BY g.sku_id
        ORDER BY ad_sales ASC
        LIMIT 1
  reference_mql: {metrics: [ad_sales], dimensions: [sku], filters: {shop: [JP]}, time: {range: calendar, unit: week, offset: -3}, order_by: {metric: ad_sales, desc: false}, limit: 1}

- id: TH07
