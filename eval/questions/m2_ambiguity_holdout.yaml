- id: AH07
  category: ambiguity
  source: gemini B5
  user_id: u_admin
  question: 我们习惯用广告花费占全店总订单金额的比重来衡量整体ROI，按这个算法，美国店10月份的ROI是多少？
  expect: no_clarify
  term: ROI
  gold_sql: |
    SELECT
      (SELECT SUM(s.spend)
       FROM ad_daily_stats s
       JOIN ad_groups g ON g.ad_group_id = s.ad_group_id
       JOIN ad_campaigns c ON c.campaign_id = g.campaign_id
       WHERE c.shop_id = 'US' AND s.stat_date BETWEEN '2026-10-01' AND '2026-10-31')
      /
      (SELECT SUM(oi.qty * oi.unit_price)
       FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
       WHERE o.shop_id = 'US' AND o.deleted_at IS NULL
         AND (o.created_at AT TIME ZONE 'America/Los_Angeles')::date BETWEEN '2026-10-01' AND '2026-10-31') AS tacos
  reference_mql: {metrics: [tacos], filters: {shop: [US]}, time: {range: custom, start: 2026-10-01, end: 2026-10-31}}

- id: AH08
  category: ambiguity
  source: gemini B7
  user_id: u_ops_us
  question: 美国店US-SKU02在9月份投广告带来的出单把退款剔除干净后，跟当月广告花费的比值（也就是实际净ROI）是多少？
  expect: no_clarify
  term: ROI
  gold_sql: |
    WITH ad AS (
      SELECT SUM(s.ad_sales) AS sales, SUM(s.spend) AS spend
      FROM ad_daily_stats s
      JOIN ad_groups g ON g.ad_group_id = s.ad_group_id
      WHERE g.sku_id = 'US-SKU02' AND s.stat_date BETWEEN '2026-09-01' AND '2026-09-30'),
    ord AS (
      SELECT SUM(x.ref) / SUM(x.amt) AS refund_rate
      FROM (SELECT oi.qty * oi.unit_price AS amt,
                   (SELECT COALESCE(SUM(r.amount), 0) FROM refunds r WHERE r.item_id = oi.item_id) AS ref
            FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
            WHERE oi.sku_id = 'US-SKU02' AND o.deleted_at IS NULL
              AND (o.created_at AT TIME ZONE 'America/Los_Angeles')::date BETWEEN '2026-09-01' AND '2026-09-30') x)
    SELECT ad.sales * (1 - ord.refund_rate) / ad.spend AS net_roas FROM ad CROSS JOIN ord
  reference_mql: {metrics: [net_roas], filters: {sku: [US-SKU02]}, time: {range: custom, start: 2026-09-01, end: 2026-09-30}}

