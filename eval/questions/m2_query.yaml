# M2 补充查询题（36 道）：单指标 14、对比 10、陷阱 8、越权 4（2026-11-12 审核时 T14 改归单指标 S26，补 A12 为新 T14）
#
# 来源：问法由 Gemini 按 eval/question_brief.md 生成（原始输出见 eval/question_sources/gemini_2026-11-11_query.txt），
#       按事先定好的规则挑选（见 CHANGELOG 2026-11-11），挑选时没有用系统试跑。source 字段对应原始编号。
#       少数题改写了措辞，改写处有注释。
# 字段：同 m1.yaml。reference_mql 为 null 的题表示 MQL 目前表达不了（自然月对比、不相邻时间段对比），
#       gold 仍然照常独立手写。
#
# 金额统一折合美元：广告侧按 stat_date 当天汇率，订单侧（含退款）按订单的店铺本地下单日汇率。
# "今天" = 2026-11-08（周日）。本周 = 11-02..11-08；上周 = 10-26..11-01；上上周 = 10-19..10-25；昨天 = 11-07。
#
# 审核状态：AI 起草，待人工审核（陷阱题、越权题逐题审；其余抽查）

# ============================== 单指标 ==============================
- id: S13
  category: single
  source: gemini A1
  user_id: u_admin
  question: 帮我看下美国店这周广告一共烧了多少钱？
  expect: rows
  gold_sql: |
    SELECT SUM(s.spend) AS ad_spend
    FROM ad_daily_stats s
    JOIN ad_groups g ON g.ad_group_id = s.ad_group_id
    JOIN ad_campaigns c ON c.campaign_id = g.campaign_id
    WHERE c.shop_id = 'US' AND s.stat_date BETWEEN '2026-11-02' AND '2026-11-08'
  reference_mql: {metrics: [ad_spend], filters: {shop: [US]}, time: {range: this_week}}

- id: S14
  category: single
  source: gemini A2
  user_id: u_ops_us
  question: US-AG03 昨天跑了多少单，ACOS 多少？
  expect: rows
  gold_sql: |
    SELECT SUM(ad_orders) AS ad_orders, SUM(spend) / SUM(ad_sales) AS acos
    FROM ad_daily_stats
