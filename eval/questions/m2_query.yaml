- id: C20
  category: compare
  source: gemini B14
  user_id: u_admin
  # 自然月对比（同 C12），MQL 表达不了
  question: 日本店 9月和 10月按月比，哪个指标改善最明显？重点看 ACOS、转化率和退款率这三个。
  expect: rows
  gold_sql: |
    WITH ad AS (
      SELECT
        SUM(s.spend * fx.rate_to_usd) FILTER (WHERE s.stat_date BETWEEN '2026-10-01' AND '2026-10-31')
          / SUM(s.ad_sales * fx.rate_to_usd) FILTER (WHERE s.stat_date BETWEEN '2026-10-01' AND '2026-10-31') AS acos_oct,
        SUM(s.spend * fx.rate_to_usd) FILTER (WHERE s.stat_date BETWEEN '2026-09-01' AND '2026-09-30')
          / SUM(s.ad_sales * fx.rate_to_usd) FILTER (WHERE s.stat_date BETWEEN '2026-09-01' AND '2026-09-30') AS acos_sep,
        SUM(s.ad_orders) FILTER (WHERE s.stat_date BETWEEN '2026-10-01' AND '2026-10-31')::numeric
          / SUM(s.clicks) FILTER (WHERE s.stat_date BETWEEN '2026-10-01' AND '2026-10-31') AS cvr_oct,
        SUM(s.ad_orders) FILTER (WHERE s.stat_date BETWEEN '2026-09-01' AND '2026-09-30')::numeric
          / SUM(s.clicks) FILTER (WHERE s.stat_date BETWEEN '2026-09-01' AND '2026-09-30') AS cvr_sep
      FROM ad_daily_stats s
      JOIN ad_groups g ON g.ad_group_id = s.ad_group_id
      JOIN ad_campaigns c ON c.campaign_id = g.campaign_id
      JOIN fx_rates fx ON fx.rate_date = s.stat_date AND fx.currency = 'JPY'
      WHERE c.shop_id = 'JP' AND s.stat_date BETWEEN '2026-09-01' AND '2026-10-31'),
    l AS (
      SELECT oi.qty * oi.unit_price AS amt, fx.rate_to_usd AS rate,
             (SELECT COALESCE(SUM(r.amount), 0) FROM refunds r WHERE r.item_id = oi.item_id) AS ref,
             (o.created_at AT TIME ZONE 'Asia/Tokyo')::date AS d
      FROM orders o
      JOIN order_items oi ON oi.order_id = o.order_id
      JOIN fx_rates fx ON fx.currency = 'JPY' AND fx.rate_date = (o.created_at AT TIME ZONE 'Asia/Tokyo')::date
      WHERE o.shop_id = 'JP' AND o.deleted_at IS NULL),
    ord AS (
      SELECT
        SUM(ref * rate) FILTER (WHERE d BETWEEN '2026-10-01' AND '2026-10-31')
          / SUM(amt * rate) FILTER (WHERE d BETWEEN '2026-10-01' AND '2026-10-31') AS refund_rate_oct,
        SUM(ref * rate) FILTER (WHERE d BETWEEN '2026-09-01' AND '2026-09-30')
          / SUM(amt * rate) FILTER (WHERE d BETWEEN '2026-09-01' AND '2026-09-30') AS refund_rate_sep
      FROM l)
    SELECT * FROM ad CROSS JOIN ord
  gold_sql_alt:   # 长表写法：每月一行
    - sql: |
        WITH ad AS (
          SELECT to_char(s.stat_date, 'YYYY-MM') AS period,
                 SUM(s.spend * fx.rate_to_usd) / SUM(s.ad_sales * fx.rate_to_usd) AS acos,
                 SUM(s.ad_orders)::numeric / SUM(s.clicks) AS cvr
          FROM ad_daily_stats s
          JOIN ad_groups g ON g.ad_group_id = s.ad_group_id
          JOIN ad_campaigns c ON c.campaign_id = g.campaign_id
          JOIN fx_rates fx ON fx.rate_date = s.stat_date AND fx.currency = 'JPY'
          WHERE c.shop_id = 'JP' AND s.stat_date BETWEEN '2026-09-01' AND '2026-10-31'
          GROUP BY 1),
        ord AS (
          SELECT to_char(x.d, 'YYYY-MM') AS period, SUM(x.ref * x.rate) / SUM(x.amt * x.rate) AS refund_rate
          FROM (SELECT oi.qty * oi.unit_price AS amt, fx.rate_to_usd AS rate,
                       (SELECT COALESCE(SUM(r.amount), 0) FROM refunds r WHERE r.item_id = oi.item_id) AS ref,
                       (o.created_at AT TIME ZONE 'Asia/Tokyo')::date AS d
                FROM orders o
                JOIN order_items oi ON oi.order_id = o.order_id
                JOIN fx_rates fx ON fx.currency = 'JPY' AND fx.rate_date = (o.created_at AT TIME ZONE 'Asia/Tokyo')::date
                WHERE o.shop_id = 'JP' AND o.deleted_at IS NULL) x
          WHERE x.d BETWEEN '2026-09-01' AND '2026-10-31'
          GROUP BY 1)
        SELECT ad.period, ad.acos, ad.cvr, ord.refund_rate FROM ad JOIN ord ON ord.period = ad.period
      key_aliases: *sep_oct
  reference_mql: null

