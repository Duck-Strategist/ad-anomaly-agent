  reference_mql: {metrics: [ad_orders, acos], filters: {ad_group: [US-AG03]}, time: {range: custom, start: 2026-11-07, end: 2026-11-07}}

- id: S15
  category: single
  source: gemini A5
  user_id: u_admin
  # 改写：原问"单次点击花费多少日元"。第一版只支持折合美元报告（SPEC Q3），去掉币种要求，记为已知局限
  question: 日本店上个月点击最贵的是哪个广告组，单次点击花费多少？
  expect: rows
  gold_sql: |
    SELECT s.ad_group_id, SUM(s.spend * fx.rate_to_usd) / SUM(s.clicks) AS cpc
    FROM ad_daily_stats s
    JOIN ad_groups g ON g.ad_group_id = s.ad_group_id
    JOIN ad_campaigns c ON c.campaign_id = g.campaign_id
    JOIN fx_rates fx ON fx.rate_date = s.stat_date AND fx.currency = 'JPY'
    WHERE c.shop_id = 'JP' AND s.stat_date BETWEEN '2026-10-01' AND '2026-10-31'
    GROUP BY s.ad_group_id
    ORDER BY cpc DESC
    LIMIT 1
  reference_mql: {metrics: [cpc], dimensions: [ad_group], filters: {shop: [JP]}, time: {range: custom, start: 2026-10-01, end: 2026-10-31}, order_by: {metric: cpc, desc: true}, limit: 1}

