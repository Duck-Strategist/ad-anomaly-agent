- id: S17
  category: single
  source: gemini A7
  user_id: u_ops_uk
  # 改写：原问"各自退了多少"，可理解为退款金额或退款率（Gemini 注明的意思是退款率），改为"退货率各是多少"使意思唯一
  question: 国庆那周英国店退货率最高的三个商品是哪几个，退货率各是多少？
  expect: rows
  gold_sql: |
    WITH l AS (
      SELECT oi.sku_id, oi.qty * oi.unit_price AS amt, fx.rate_to_usd AS rate,
             (SELECT COALESCE(SUM(r.amount), 0) FROM refunds r WHERE r.item_id = oi.item_id) AS ref
      FROM orders o
      JOIN order_items oi ON oi.order_id = o.order_id
      JOIN fx_rates fx ON fx.currency = 'GBP' AND fx.rate_date = (o.created_at AT TIME ZONE 'Europe/London')::date
      WHERE o.shop_id = 'UK' AND o.deleted_at IS NULL
        AND (o.created_at AT TIME ZONE 'Europe/London')::date BETWEEN '2026-09-28' AND '2026-10-04')
    SELECT sku_id, SUM(ref * rate) / SUM(amt * rate) AS refund_rate
    FROM l GROUP BY sku_id
    ORDER BY refund_rate DESC
    LIMIT 3
  reference_mql: {metrics: [refund_rate], dimensions: [sku], filters: {shop: [UK]}, time: {range: custom, start: 2026-09-28, end: 2026-10-04}, order_by: {metric: refund_rate, desc: true}, limit: 3}

- id: S18
