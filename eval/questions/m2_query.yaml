- id: C15
  category: compare
  source: gemini B6
  user_id: u_viewer_us
  question: 昨天（周六）和前天（周五）比，US-AG07 的曝光、点击和单次点击花费分别是涨了还是跌了？
  expect: rows
  gold_sql: |
    SELECT
      SUM(impressions) FILTER (WHERE stat_date = '2026-11-07') AS impressions_cur,
      SUM(impressions) FILTER (WHERE stat_date = '2026-11-06') AS impressions_prev,
      SUM(clicks) FILTER (WHERE stat_date = '2026-11-07') AS clicks_cur,
      SUM(clicks) FILTER (WHERE stat_date = '2026-11-06') AS clicks_prev,
      SUM(spend) FILTER (WHERE stat_date = '2026-11-07') / SUM(clicks) FILTER (WHERE stat_date = '2026-11-07') AS cpc_cur,
      SUM(spend) FILTER (WHERE stat_date = '2026-11-06') / SUM(clicks) FILTER (WHERE stat_date = '2026-11-06') AS cpc_prev
    FROM ad_daily_stats
    WHERE ad_group_id = 'US-AG07' AND stat_date IN ('2026-11-06', '2026-11-07')
  reference_mql: {metrics: [impressions, clicks, cpc], filters: {ad_group: [US-AG07]}, time: {range: custom, start: 2026-11-07, end: 2026-11-07, compare: previous_period}}

- id: C16
  category: compare
  source: gemini B7
  user_id: u_ops_uk
  # 自然月对比（同 C12），MQL 表达不了
  question: 对比一下英国店 9月和 10月，UK-C1、UK-C2、UK-C3 这三个活动的 ACOS 各自变高了还是变低了？
  expect: rows
  gold_sql: |
    SELECT g.campaign_id,
      SUM(s.spend * fx.rate_to_usd) FILTER (WHERE s.stat_date BETWEEN '2026-10-01' AND '2026-10-31')
        / SUM(s.ad_sales * fx.rate_to_usd) FILTER (WHERE s.stat_date BETWEEN '2026-10-01' AND '2026-10-31') AS acos_oct,
      SUM(s.spend * fx.rate_to_usd) FILTER (WHERE s.stat_date BETWEEN '2026-09-01' AND '2026-09-30')
        / SUM(s.ad_sales * fx.rate_to_usd) FILTER (WHERE s.stat_date BETWEEN '2026-09-01' AND '2026-09-30') AS acos_sep
    FROM ad_daily_stats s
    JOIN ad_groups g ON g.ad_group_id = s.ad_group_id
    JOIN fx_rates fx ON fx.rate_date = s.stat_date AND fx.currency = 'GBP'
    WHERE g.campaign_id IN ('UK-C1', 'UK-C2', 'UK-C3') AND s.stat_date BETWEEN '2026-09-01' AND '2026-10-31'
    GROUP BY g.campaign_id
  gold_sql_alt:   # 长表写法：广告活动 × 月份
    - sql: |
        SELECT g.campaign_id, to_char(s.stat_date, 'YYYY-MM') AS period,
               SUM(s.spend * fx.rate_to_usd) / SUM(s.ad_sales * fx.rate_to_usd) AS acos
        FROM ad_daily_stats s
        JOIN ad_groups g ON g.ad_group_id = s.ad_group_id
        JOIN fx_rates fx ON fx.rate_date = s.stat_date AND fx.currency = 'GBP'
        WHERE g.campaign_id IN ('UK-C1', 'UK-C2', 'UK-C3') AND s.stat_date BETWEEN '2026-09-01' AND '2026-10-31'
        GROUP BY 1, 2
      key_aliases: *sep_oct
  reference_mql: null

- id: C17
  category: compare
  source: gemini B11
  user_id: u_admin
  # 改写：原问"9月1号到9月20号（同样21天）"，但 9-01..9-20 只有 20 天，问题自相矛盾（gold 和编译器核对时发现）。
  #       改为 9 月 21 号，使两段都是 21 天、与"同样21天"一致
  question: 8月11号到8月底，和 9月1号到9月21号（同样21天），三家店合计的广告花费和广告带来的销售额分别是多少，ROAS 变高了吗？
  expect: rows
  gold_sql: |
    WITH a AS (
      SELECT s.stat_date, s.spend * fx.rate_to_usd AS spend, s.ad_sales * fx.rate_to_usd AS sales
      FROM ad_daily_stats s
      JOIN ad_groups g ON g.ad_group_id = s.ad_group_id
      JOIN ad_campaigns c ON c.campaign_id = g.campaign_id
      JOIN shops sh ON sh.shop_id = c.shop_id
      JOIN fx_rates fx ON fx.rate_date = s.stat_date AND fx.currency = sh.currency
      WHERE s.stat_date BETWEEN '2026-08-11' AND '2026-09-21')
    SELECT
      SUM(spend) FILTER (WHERE stat_date >= '2026-09-01') AS ad_spend_cur,
      SUM(spend) FILTER (WHERE stat_date <  '2026-09-01') AS ad_spend_prev,
      SUM(sales) FILTER (WHERE stat_date >= '2026-09-01') AS ad_sales_cur,
      SUM(sales) FILTER (WHERE stat_date <  '2026-09-01') AS ad_sales_prev,
      SUM(sales) FILTER (WHERE stat_date >= '2026-09-01') / SUM(spend) FILTER (WHERE stat_date >= '2026-09-01') AS roas_cur,
      SUM(sales) FILTER (WHERE stat_date <  '2026-09-01') / SUM(spend) FILTER (WHERE stat_date <  '2026-09-01') AS roas_prev
    FROM a
  reference_mql: {metrics: [ad_spend, ad_sales, roas], time: {range: custom, start: 2026-09-01, end: 2026-09-21, compare: previous_period}}

- id: C18
  category: compare
  source: gemini B12
  user_id: u_ops_us
  # 不相邻时间段对比（11-01..11-07 vs 10-01..10-07），MQL 表达不了。11 月这段的退款尚未全部入账
  question: 11月前7天（1号到7号）和 10月前7天（1号到7号）比，美国店全店客单价和退款率有什么变化？
  expect: rows
  gold_sql: |
    WITH l AS (
      SELECT o.order_id, oi.qty * oi.unit_price AS amt,
             (SELECT COALESCE(SUM(r.amount), 0) FROM refunds r WHERE r.item_id = oi.item_id) AS ref,
             (o.created_at AT TIME ZONE 'America/Los_Angeles')::date AS d
      FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
      WHERE o.shop_id = 'US' AND o.deleted_at IS NULL)
    SELECT
      SUM(amt) FILTER (WHERE d BETWEEN '2026-11-01' AND '2026-11-07')
        / COUNT(DISTINCT order_id) FILTER (WHERE d BETWEEN '2026-11-01' AND '2026-11-07') AS aov_nov,
      SUM(amt) FILTER (WHERE d BETWEEN '2026-10-01' AND '2026-10-07')
        / COUNT(DISTINCT order_id) FILTER (WHERE d BETWEEN '2026-10-01' AND '2026-10-07') AS aov_oct,
      SUM(ref) FILTER (WHERE d BETWEEN '2026-11-01' AND '2026-11-07')
        / SUM(amt) FILTER (WHERE d BETWEEN '2026-11-01' AND '2026-11-07') AS refund_rate_nov,
      SUM(ref) FILTER (WHERE d BETWEEN '2026-10-01' AND '2026-10-07')
        / SUM(amt) FILTER (WHERE d BETWEEN '2026-10-01' AND '2026-10-07') AS refund_rate_oct
    FROM l
  gold_sql_alt:   # 长表写法：每个时间段一行
    - sql: |
        WITH l AS (
          SELECT o.order_id, oi.qty * oi.unit_price AS amt,
                 (SELECT COALESCE(SUM(r.amount), 0) FROM refunds r WHERE r.item_id = oi.item_id) AS ref,
                 (o.created_at AT TIME ZONE 'America/Los_Angeles')::date AS d
          FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
          WHERE o.shop_id = 'US' AND o.deleted_at IS NULL)
        SELECT CASE WHEN d >= '2026-11-01' THEN '2026-11' ELSE '2026-10' END AS period,
               SUM(amt) / COUNT(DISTINCT order_id) AS aov, SUM(ref) / SUM(amt) AS refund_rate
        FROM l
        WHERE d BETWEEN '2026-11-01' AND '2026-11-07' OR d BETWEEN '2026-10-01' AND '2026-10-07'
        GROUP BY 1
      key_aliases:
        "2026-11": ["2026-11-01", "2026-11-01~2026-11-07", "11月", "11月前7天", "11", "nov", "november", "current", "cur", "本期"]
        "2026-10": ["2026-10-01", "2026-10-01~2026-10-07", "10月", "10月前7天", "10", "oct", "october", "previous", "prev", "上期"]
  reference_mql: null

