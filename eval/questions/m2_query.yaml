# ============================== 对比 ==============================
- id: C11
  category: compare
  source: gemini B2
  user_id: u_admin
  question: 10月份英国店和日本店，哪家店的 TACOS 更低，两边各是多少？
  expect: rows
  gold_sql: |
    WITH ad AS (
      SELECT c.shop_id, SUM(s.spend * fx.rate_to_usd) AS spend
      FROM ad_daily_stats s
      JOIN ad_groups g ON g.ad_group_id = s.ad_group_id
      JOIN ad_campaigns c ON c.campaign_id = g.campaign_id
      JOIN shops sh ON sh.shop_id = c.shop_id
      JOIN fx_rates fx ON fx.rate_date = s.stat_date AND fx.currency = sh.currency
      WHERE c.shop_id IN ('UK', 'JP') AND s.stat_date BETWEEN '2026-10-01' AND '2026-10-31'
      GROUP BY c.shop_id),
    ord AS (
      SELECT o.shop_id, SUM(oi.qty * oi.unit_price * fx.rate_to_usd) AS gross
      FROM orders o
      JOIN shops sh ON sh.shop_id = o.shop_id
      JOIN order_items oi ON oi.order_id = o.order_id
      JOIN fx_rates fx ON fx.currency = sh.currency AND fx.rate_date = (o.created_at AT TIME ZONE sh.timezone)::date
      WHERE o.shop_id IN ('UK', 'JP') AND o.deleted_at IS NULL
        AND (o.created_at AT TIME ZONE sh.timezone)::date BETWEEN '2026-10-01' AND '2026-10-31'
      GROUP BY o.shop_id)
    SELECT ad.shop_id, ad.spend / ord.gross AS tacos
    FROM ad JOIN ord ON ord.shop_id = ad.shop_id
  reference_mql: {metrics: [tacos], dimensions: [shop], filters: {shop: [UK, JP]}, time: {range: custom, start: 2026-10-01, end: 2026-10-31}}

- id: C12
  category: compare
  source: gemini B3
  user_id: u_ops_uk
  # 自然月对比：10 月（31 天）vs 9 月（30 天）。MQL 的 previous_period 只能取紧邻的等长时段（8-31..9-30），表达不了
  question: UK-SKU04 上个月的订单数、退款率和扣完退款的销售额，跟 9月份比怎么样？
  expect: rows
  gold_sql: |
    WITH l AS (
      SELECT o.order_id, oi.qty * oi.unit_price AS amt, fx.rate_to_usd AS rate,
             (SELECT COALESCE(SUM(r.amount), 0) FROM refunds r WHERE r.item_id = oi.item_id) AS ref,
             (o.created_at AT TIME ZONE 'Europe/London')::date AS d
      FROM orders o
      JOIN order_items oi ON oi.order_id = o.order_id
      JOIN fx_rates fx ON fx.currency = 'GBP' AND fx.rate_date = (o.created_at AT TIME ZONE 'Europe/London')::date
      WHERE oi.sku_id = 'UK-SKU04' AND o.deleted_at IS NULL)
    SELECT
      COUNT(DISTINCT order_id) FILTER (WHERE d BETWEEN '2026-10-01' AND '2026-10-31') AS order_count_oct,
      COUNT(DISTINCT order_id) FILTER (WHERE d BETWEEN '2026-09-01' AND '2026-09-30') AS order_count_sep,
      SUM(ref * rate) FILTER (WHERE d BETWEEN '2026-10-01' AND '2026-10-31')
        / SUM(amt * rate) FILTER (WHERE d BETWEEN '2026-10-01' AND '2026-10-31') AS refund_rate_oct,
      SUM(ref * rate) FILTER (WHERE d BETWEEN '2026-09-01' AND '2026-09-30')
        / SUM(amt * rate) FILTER (WHERE d BETWEEN '2026-09-01' AND '2026-09-30') AS refund_rate_sep,
      SUM((amt - ref) * rate) FILTER (WHERE d BETWEEN '2026-10-01' AND '2026-10-31') AS net_sales_oct,
      SUM((amt - ref) * rate) FILTER (WHERE d BETWEEN '2026-09-01' AND '2026-09-30') AS net_sales_sep
    FROM l
  # 同一组数字的长表写法（每月一行），和主 gold 任意一个对上即可（2026-11-12 审核时补）。月份写法不统一，用别名表对齐
  gold_sql_alt:
    - sql: |
        WITH l AS (
          SELECT o.order_id, oi.qty * oi.unit_price AS amt, fx.rate_to_usd AS rate,
                 (SELECT COALESCE(SUM(r.amount), 0) FROM refunds r WHERE r.item_id = oi.item_id) AS ref,
                 (o.created_at AT TIME ZONE 'Europe/London')::date AS d
          FROM orders o
          JOIN order_items oi ON oi.order_id = o.order_id
          JOIN fx_rates fx ON fx.currency = 'GBP' AND fx.rate_date = (o.created_at AT TIME ZONE 'Europe/London')::date
          WHERE oi.sku_id = 'UK-SKU04' AND o.deleted_at IS NULL)
        SELECT to_char(d, 'YYYY-MM') AS period, COUNT(DISTINCT order_id) AS order_count,
               SUM(ref * rate) / SUM(amt * rate) AS refund_rate, SUM((amt - ref) * rate) AS net_sales
        FROM l WHERE d BETWEEN '2026-09-01' AND '2026-10-31'
        GROUP BY 1
      key_aliases: &sep_oct
        "2026-09": ["2026-09-01", "9月", "九月", "9", "09", "sep", "september", "previous", "prev", "上期", "上月"]
        "2026-10": ["2026-10-01", "10月", "十月", "10", "oct", "october", "current", "cur", "本期", "本月"]
  reference_mql: null

