      SUM(spend) FILTER (WHERE d BETWEEN '2026-10-26' AND '2026-11-01') / SUM(sales) FILTER (WHERE d BETWEEN '2026-10-26' AND '2026-11-01') AS acos_cur,
      SUM(spend) FILTER (WHERE d BETWEEN '2026-10-19' AND '2026-10-25') / SUM(sales) FILTER (WHERE d BETWEEN '2026-10-19' AND '2026-10-25') AS acos_prev,
      SUM(sales) FILTER (WHERE d BETWEEN '2026-10-26' AND '2026-11-01') / SUM(spend) FILTER (WHERE d BETWEEN '2026-10-26' AND '2026-11-01') AS roas_cur,
      SUM(sales) FILTER (WHERE d BETWEEN '2026-10-19' AND '2026-10-25') / SUM(spend) FILTER (WHERE d BETWEEN '2026-10-19' AND '2026-10-25') AS roas_prev
    FROM ad
    WHERE d BETWEEN '2026-10-19' AND '2026-11-01'
    GROUP BY ad_group_id
  reference_mql: {metrics: [ad_spend, acos, roas], dimensions: [ad_group], filters: {shop: [US]}, time: {range: last_week, compare: previous_period}}

- id: CP23
  category: compare_period
  source: gemini C3
  user_id: u_ops_uk
  question: 帮我拉一下英国店这周（11月2号到8号）跟上周（10月26号到11月1号）比，三个广告活动（UK-C1到UK-C3）各自的曝光、点击率、广告带来的销售额分别是多少？
  expect: rows
  periods: 2
  gold_sql: |
    WITH ad AS (
      SELECT c.shop_id, g.campaign_id, s.ad_group_id, g.sku_id, s.stat_date AS d,
             s.spend * fx.rate_to_usd AS spend, s.ad_sales * fx.rate_to_usd AS sales,
             s.impressions, s.clicks, s.ad_orders
      FROM ad_daily_stats s
      JOIN ad_groups g ON g.ad_group_id = s.ad_group_id
      JOIN ad_campaigns c ON c.campaign_id = g.campaign_id
      JOIN shops sh ON sh.shop_id = c.shop_id
      JOIN fx_rates fx ON fx.currency = sh.currency AND fx.rate_date = s.stat_date
      WHERE c.shop_id = 'UK')
    SELECT
      campaign_id,
      SUM(impressions) FILTER (WHERE d BETWEEN '2026-11-02' AND '2026-11-08') AS impressions_cur,
      SUM(impressions) FILTER (WHERE d BETWEEN '2026-10-26' AND '2026-11-01') AS impressions_prev,
      SUM(clicks) FILTER (WHERE d BETWEEN '2026-11-02' AND '2026-11-08')::numeric / SUM(impressions) FILTER (WHERE d BETWEEN '2026-11-02' AND '2026-11-08') AS ctr_cur,
      SUM(clicks) FILTER (WHERE d BETWEEN '2026-10-26' AND '2026-11-01')::numeric / SUM(impressions) FILTER (WHERE d BETWEEN '2026-10-26' AND '2026-11-01') AS ctr_prev,
      SUM(sales) FILTER (WHERE d BETWEEN '2026-11-02' AND '2026-11-08') AS ad_sales_cur,
      SUM(sales) FILTER (WHERE d BETWEEN '2026-10-26' AND '2026-11-01') AS ad_sales_prev
    FROM ad
    WHERE d BETWEEN '2026-10-26' AND '2026-11-08'
    GROUP BY campaign_id
  reference_mql: {metrics: [impressions, ctr, ad_sales], dimensions: [campaign], filters: {shop: [UK]}, time: {range: this_week, compare: previous_period}}
  rewrite: 去掉“英镑”（同上）

- id: CP24
  category: compare_period
  source: gemini C4
  user_id: u_admin
  question: 11月1号到今天这8天，跟10月前8天（10月1号到8号）比，日本店两个广告活动JP-C1和JP-C2各自的广告带来的订单数、单次点击花费、转化率各是多少？
  expect: rows
  periods: 2
  gold_sql: |
    WITH ad AS (
      SELECT c.shop_id, g.campaign_id, s.ad_group_id, g.sku_id, s.stat_date AS d,
             s.spend * fx.rate_to_usd AS spend, s.ad_sales * fx.rate_to_usd AS sales,
             s.impressions, s.clicks, s.ad_orders
      FROM ad_daily_stats s
      JOIN ad_groups g ON g.ad_group_id = s.ad_group_id
      JOIN ad_campaigns c ON c.campaign_id = g.campaign_id
      JOIN shops sh ON sh.shop_id = c.shop_id
      JOIN fx_rates fx ON fx.currency = sh.currency AND fx.rate_date = s.stat_date
      WHERE c.shop_id = 'JP')
    SELECT
      campaign_id,
      SUM(ad_orders) FILTER (WHERE d BETWEEN '2026-11-01' AND '2026-11-08') AS ad_orders_cur,
      SUM(ad_orders) FILTER (WHERE d BETWEEN '2026-10-01' AND '2026-10-08') AS ad_orders_prev,
      SUM(spend) FILTER (WHERE d BETWEEN '2026-11-01' AND '2026-11-08') / SUM(clicks) FILTER (WHERE d BETWEEN '2026-11-01' AND '2026-11-08') AS cpc_cur,
      SUM(spend) FILTER (WHERE d BETWEEN '2026-10-01' AND '2026-10-08') / SUM(clicks) FILTER (WHERE d BETWEEN '2026-10-01' AND '2026-10-08') AS cpc_prev,
      SUM(ad_orders) FILTER (WHERE d BETWEEN '2026-11-01' AND '2026-11-08')::numeric / SUM(clicks) FILTER (WHERE d BETWEEN '2026-11-01' AND '2026-11-08') AS cvr_cur,
      SUM(ad_orders) FILTER (WHERE d BETWEEN '2026-10-01' AND '2026-10-08')::numeric / SUM(clicks) FILTER (WHERE d BETWEEN '2026-10-01' AND '2026-10-08') AS cvr_prev
    FROM ad
    WHERE d BETWEEN '2026-10-01' AND '2026-11-08'
    GROUP BY campaign_id
  reference_mql: {metrics: [ad_orders, cpc, cvr], dimensions: [campaign], filters: {shop: [JP]}, time: {range: calendar, unit: month, offset: 0, compare: previous_period}}

- id: CP25
  category: compare_period
  source: gemini C5
  user_id: u_ops_us
  question: 请教下，主管让我填周报，美国店投了广告的那10个商品（US-SKU01到US-SKU10），在10月上半月（10月1号到15号）和10月下半月（10月16号到31号）各自的订单数、客单价和退款率分别是多少，能按每个商品拆开列一下吗？
  expect: rows
  periods: 2
  gold_sql: |
    WITH ol AS (
      SELECT o.shop_id, o.order_id, oi.sku_id, (o.created_at AT TIME ZONE sh.timezone)::date AS d,
             oi.qty * oi.unit_price * fx.rate_to_usd AS amt,
             (SELECT COALESCE(SUM(r.amount), 0) FROM refunds r WHERE r.item_id = oi.item_id) * fx.rate_to_usd AS ref
      FROM orders o
      JOIN shops sh ON sh.shop_id = o.shop_id
      JOIN order_items oi ON oi.order_id = o.order_id
      JOIN fx_rates fx ON fx.currency = sh.currency AND fx.rate_date = (o.created_at AT TIME ZONE sh.timezone)::date
      WHERE o.deleted_at IS NULL AND oi.sku_id IN ('US-SKU01', 'US-SKU02', 'US-SKU03', 'US-SKU04', 'US-SKU05', 'US-SKU06', 'US-SKU07', 'US-SKU08', 'US-SKU09', 'US-SKU10'))
    SELECT
      sku_id,
      COUNT(DISTINCT order_id) FILTER (WHERE d BETWEEN '2026-10-16' AND '2026-10-31') AS order_count_cur,
      COUNT(DISTINCT order_id) FILTER (WHERE d BETWEEN '2026-10-01' AND '2026-10-15') AS order_count_prev,
      SUM(amt) FILTER (WHERE d BETWEEN '2026-10-16' AND '2026-10-31') / COUNT(DISTINCT order_id) FILTER (WHERE d BETWEEN '2026-10-16' AND '2026-10-31') AS aov_cur,
      SUM(amt) FILTER (WHERE d BETWEEN '2026-10-01' AND '2026-10-15') / COUNT(DISTINCT order_id) FILTER (WHERE d BETWEEN '2026-10-01' AND '2026-10-15') AS aov_prev,
      SUM(ref) FILTER (WHERE d BETWEEN '2026-10-16' AND '2026-10-31') / SUM(amt) FILTER (WHERE d BETWEEN '2026-10-16' AND '2026-10-31') AS refund_rate_cur,
      SUM(ref) FILTER (WHERE d BETWEEN '2026-10-01' AND '2026-10-15') / SUM(amt) FILTER (WHERE d BETWEEN '2026-10-01' AND '2026-10-15') AS refund_rate_prev
    FROM ol
    WHERE d BETWEEN '2026-10-01' AND '2026-10-31'
    GROUP BY sku_id
  reference_mql: {metrics: [order_count, aov, refund_rate], dimensions: [sku], filters: {sku: [US-SKU01, US-SKU02, US-SKU03, US-SKU04, US-SKU05, US-SKU06, US-SKU07, US-SKU08, US-SKU09, US-SKU10]}, time: {range: custom, start: '2026-10-16', end: '2026-10-31', compare: {range: custom, start: '2026-10-01', end: '2026-10-15'}}}
