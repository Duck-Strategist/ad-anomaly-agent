- id: CP08
  category: compare_period
  source: gemini A8
  user_id: u_ops_us
  question: 请问一下，美国店这个月1号到今天这8天，和10月整月比的话，全店的客单价和退款率在两段时间里分别是多少呀？
  expect: rows
  periods: 2
  gold_sql: |
    WITH ol AS (
      SELECT o.shop_id, o.order_id, oi.sku_id, (o.created_at AT TIME ZONE sh.timezone)::date AS d,
             oi.qty * oi.unit_price * fx.rate_to_usd AS amt,
             (SELECT COALESCE(SUM(r.amount), 0) FROM refunds r WHERE r.item_id = oi.item_id) * fx.rate_to_usd AS ref
      FROM orders o
      JOIN shops sh ON sh.shop_id = o.shop_id
      JOIN order_items oi ON oi.order_id = o.order_id
      JOIN fx_rates fx ON fx.currency = sh.currency AND fx.rate_date = (o.created_at AT TIME ZONE sh.timezone)::date
      WHERE o.deleted_at IS NULL AND o.shop_id = 'US')
    SELECT
      SUM(amt) FILTER (WHERE d BETWEEN '2026-11-01' AND '2026-11-08') / COUNT(DISTINCT order_id) FILTER (WHERE d BETWEEN '2026-11-01' AND '2026-11-08') AS aov_cur,
      SUM(amt) FILTER (WHERE d BETWEEN '2026-10-01' AND '2026-10-31') / COUNT(DISTINCT order_id) FILTER (WHERE d BETWEEN '2026-10-01' AND '2026-10-31') AS aov_prev,
      SUM(ref) FILTER (WHERE d BETWEEN '2026-11-01' AND '2026-11-08') / SUM(amt) FILTER (WHERE d BETWEEN '2026-11-01' AND '2026-11-08') AS refund_rate_cur,
      SUM(ref) FILTER (WHERE d BETWEEN '2026-10-01' AND '2026-10-31') / SUM(amt) FILTER (WHERE d BETWEEN '2026-10-01' AND '2026-10-31') AS refund_rate_prev
    FROM ol
    WHERE d BETWEEN '2026-10-01' AND '2026-11-08'
  reference_mql: {metrics: [aov, refund_rate], filters: {shop: [US]}, time: {range: calendar, unit: month, offset: 0, compare: {range: custom, start: '2026-10-01', end: '2026-10-31'}}}

