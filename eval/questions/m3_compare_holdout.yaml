      SUM(ad_orders) FILTER (WHERE d BETWEEN '2026-11-02' AND '2026-11-08')::numeric / SUM(clicks) FILTER (WHERE d BETWEEN '2026-11-02' AND '2026-11-08') AS cvr_cur,
      SUM(ad_orders) FILTER (WHERE d BETWEEN '2026-10-26' AND '2026-11-01')::numeric / SUM(clicks) FILTER (WHERE d BETWEEN '2026-10-26' AND '2026-11-01') AS cvr_prev,
      SUM(spend) FILTER (WHERE d BETWEEN '2026-11-02' AND '2026-11-08') / SUM(clicks) FILTER (WHERE d BETWEEN '2026-11-02' AND '2026-11-08') AS cpc_cur,
      SUM(spend) FILTER (WHERE d BETWEEN '2026-10-26' AND '2026-11-01') / SUM(clicks) FILTER (WHERE d BETWEEN '2026-10-26' AND '2026-11-01') AS cpc_prev
