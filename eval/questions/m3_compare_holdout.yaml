# M3 两段时间对比留出集（25 道）：按自然月 / 周对比 12（CP01–CP12）、任意两段 8（CP13–CP20）、对比的同时拆分 5（CP21–CP25）
#
# 用途：两段时间对比的修复（SPEC Q20）是看了 M2 全集里 C12、C16、C17、C18、C20 之后设计的，在原题上复测会偏高。
#       本文件在修复代码提交之前写好 gold 并冻结；修复期间不在这些题上跑模型。修复后每题跑 3 次，报 pass^3 和单次准确率。
# 来源：问法由 Gemini 按 eval/question_brief_compare.md 生成（原始输出 eval/question_sources/gemini_2026-11-14_compare.txt），
#       用户挑选：25 道全部保留；6 道去掉"英镑 / 日元"（系统只按美元报告）；"涨了多少 / 差了多少"保留问法，只判两期数值。
# 判分：gold 是宽表（每个指标本期、对比期各一列）。periods: 2 的题，候选结果是长表（每期一行）时先转成宽表再比，
#       列名和期间标签都不参与比较（eval/scoring.py: long_to_wide）。
#
# 金额统一折合美元：广告侧按 stat_date 当天汇率，订单侧（含退款）按订单的店铺本地下单日汇率。
# "今天" = 2026-11-08（周日）。本周 11-02..11-08；上周 10-26..11-01；上上周 10-19..10-25。
# gold 由手写的 SQL 片段拼成（eval/gen_compare_holdout.py，不经编译器）；reference_mql 只给 check_reference 核对用，不给模型看。
#
# 审核状态：AI 起草，待人工审核


- id: CP01
  category: compare_period
  source: gemini A1
  user_id: u_admin
  question: 9月和10月我们三家店合在一起的订单金额、扣除退款后的订单金额各是多少美元？10月比9月涨了多少？
  expect: rows
  periods: 2
  gold_sql: |
    WITH ol AS (
      SELECT o.shop_id, o.order_id, oi.sku_id, (o.created_at AT TIME ZONE sh.timezone)::date AS d,
             oi.qty * oi.unit_price * fx.rate_to_usd AS amt,
             (SELECT COALESCE(SUM(r.amount), 0) FROM refunds r WHERE r.item_id = oi.item_id) * fx.rate_to_usd AS ref
      FROM orders o
      JOIN shops sh ON sh.shop_id = o.shop_id
      JOIN order_items oi ON oi.order_id = o.order_id
      JOIN fx_rates fx ON fx.currency = sh.currency AND fx.rate_date = (o.created_at AT TIME ZONE sh.timezone)::date
      WHERE o.deleted_at IS NULL AND TRUE)
    SELECT
      SUM(amt) FILTER (WHERE d BETWEEN '2026-10-01' AND '2026-10-31') AS gross_sales_cur,
      SUM(amt) FILTER (WHERE d BETWEEN '2026-09-01' AND '2026-09-30') AS gross_sales_prev,
      SUM(amt - ref) FILTER (WHERE d BETWEEN '2026-10-01' AND '2026-10-31') AS net_sales_cur,
      SUM(amt - ref) FILTER (WHERE d BETWEEN '2026-09-01' AND '2026-09-30') AS net_sales_prev
    FROM ol
    WHERE d BETWEEN '2026-09-01' AND '2026-10-31'
  reference_mql: {metrics: [gross_sales, net_sales], time: {range: custom, start: '2026-10-01', end: '2026-10-31', compare: previous_period}}

- id: CP02
  category: compare_period
  source: gemini A2
  user_id: u_ops_us
  question: 帮我拉一下美国店上个月和上上个月的广告花费、广告带来的销售额还有ACOS分别是多少，看看上个月ACOS是变好了还是变差了。
  expect: rows
  periods: 2
  gold_sql: |
    WITH ad AS (
      SELECT c.shop_id, g.campaign_id, s.ad_group_id, g.sku_id, s.stat_date AS d,
             s.spend * fx.rate_to_usd AS spend, s.ad_sales * fx.rate_to_usd AS sales,
             s.impressions, s.clicks, s.ad_orders
      FROM ad_daily_stats s
      JOIN ad_groups g ON g.ad_group_id = s.ad_group_id
      JOIN ad_campaigns c ON c.campaign_id = g.campaign_id
      JOIN shops sh ON sh.shop_id = c.shop_id
      JOIN fx_rates fx ON fx.currency = sh.currency AND fx.rate_date = s.stat_date
      WHERE c.shop_id = 'US')
    SELECT
      SUM(spend) FILTER (WHERE d BETWEEN '2026-10-01' AND '2026-10-31') AS ad_spend_cur,
      SUM(spend) FILTER (WHERE d BETWEEN '2026-09-01' AND '2026-09-30') AS ad_spend_prev,
      SUM(sales) FILTER (WHERE d BETWEEN '2026-10-01' AND '2026-10-31') AS ad_sales_cur,
      SUM(sales) FILTER (WHERE d BETWEEN '2026-09-01' AND '2026-09-30') AS ad_sales_prev,
      SUM(spend) FILTER (WHERE d BETWEEN '2026-10-01' AND '2026-10-31') / SUM(sales) FILTER (WHERE d BETWEEN '2026-10-01' AND '2026-10-31') AS acos_cur,
      SUM(spend) FILTER (WHERE d BETWEEN '2026-09-01' AND '2026-09-30') / SUM(sales) FILTER (WHERE d BETWEEN '2026-09-01' AND '2026-09-30') AS acos_prev
    FROM ad
    WHERE d BETWEEN '2026-09-01' AND '2026-10-31'
  reference_mql: {metrics: [ad_spend, ad_sales, acos], filters: {shop: [US]}, time: {range: calendar, unit: month, offset: -1, compare: previous_period}}

- id: CP03
  category: compare_period
  source: gemini A3
  user_id: u_ops_uk
  question: 那个，我是新来对账的助理，想问下英国店这个月到今天为止，跟上个月同期前8天（10月1号到8号）比，订单数和退款金额各是多少呀？
  expect: rows
  periods: 2
  gold_sql: |
    WITH ol AS (
      SELECT o.shop_id, o.order_id, oi.sku_id, (o.created_at AT TIME ZONE sh.timezone)::date AS d,
             oi.qty * oi.unit_price * fx.rate_to_usd AS amt,
             (SELECT COALESCE(SUM(r.amount), 0) FROM refunds r WHERE r.item_id = oi.item_id) * fx.rate_to_usd AS ref
      FROM orders o
      JOIN shops sh ON sh.shop_id = o.shop_id
      JOIN order_items oi ON oi.order_id = o.order_id
      JOIN fx_rates fx ON fx.currency = sh.currency AND fx.rate_date = (o.created_at AT TIME ZONE sh.timezone)::date
      WHERE o.deleted_at IS NULL AND o.shop_id = 'UK')
    SELECT
      COUNT(DISTINCT order_id) FILTER (WHERE d BETWEEN '2026-11-01' AND '2026-11-08') AS order_count_cur,
      COUNT(DISTINCT order_id) FILTER (WHERE d BETWEEN '2026-10-01' AND '2026-10-08') AS order_count_prev,
      SUM(ref) FILTER (WHERE d BETWEEN '2026-11-01' AND '2026-11-08') AS refund_amount_cur,
      SUM(ref) FILTER (WHERE d BETWEEN '2026-10-01' AND '2026-10-08') AS refund_amount_prev
    FROM ol
    WHERE d BETWEEN '2026-10-01' AND '2026-11-08'
  reference_mql: {metrics: [order_count, refund_amount], filters: {shop: [UK]}, time: {range: calendar, unit: month, offset: 0, compare: previous_period}}
  rewrite: 去掉“英镑”（系统只按美元报告，同 TH08）

