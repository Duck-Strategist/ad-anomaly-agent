- id: T10
  category: trap
  trap: refund
  user_id: u_admin
  # 用 9 月而不是"上周"：上周的订单大部分退款还没发生（退款晚 3–14 天），考不出退款口径（2026-11-09 修订）
  question: 9 月份英国店扣除退款后的净销售额折合多少美元？
  expect: rows
  gold_sql: |
    WITH lines AS (
      SELECT oi.item_id, oi.qty * oi.unit_price AS amt,
             (o.created_at AT TIME ZONE 'Europe/London')::date AS d
      FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
      WHERE o.shop_id = 'UK' AND o.deleted_at IS NULL)
    SELECT SUM((l.amt - COALESCE((SELECT SUM(amount) FROM refunds r WHERE r.item_id = l.item_id), 0)) * fx.rate_to_usd) AS net_sales_usd
    FROM lines l JOIN fx_rates fx ON fx.rate_date = l.d AND fx.currency = 'GBP'
    WHERE l.d BETWEEN '2026-09-01' AND '2026-09-30'
  reference_mql: {metrics: [net_sales], filters: {shop: [UK]}, time: {range: custom, start: 2026-09-01, end: 2026-09-30}}

