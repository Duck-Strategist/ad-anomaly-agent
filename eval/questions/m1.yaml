  expect: rows
  gold_sql: |
    WITH lines AS (
      SELECT oi.item_id, oi.qty * oi.unit_price AS amt,
             (o.created_at AT TIME ZONE 'Europe/London')::date AS d
      FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
      WHERE oi.sku_id = 'UK-SKU05' AND o.deleted_at IS NULL)
    SELECT SUM(COALESCE((SELECT SUM(amount) FROM refunds r WHERE r.item_id = l.item_id), 0) * fx.rate_to_usd)
           / SUM(l.amt * fx.rate_to_usd) AS refund_rate
    FROM lines l JOIN fx_rates fx ON fx.rate_date = l.d AND fx.currency = 'GBP'
    WHERE l.d BETWEEN '2026-10-12' AND '2026-10-18'
  reference_mql: {metrics: [refund_rate], filters: {sku: [UK-SKU05]}, time: {range: custom, start: 2026-10-12, end: 2026-10-18}}

- id: T12
  category: trap
  trap: refund
  user_id: u_ops_us
  question: 9 月份美国店订单的退款金额一共是多少？
  expect: rows
  gold_sql: |
    SELECT SUM(r.amount) AS refund_amount
    FROM refunds r
    JOIN order_items oi ON oi.item_id = r.item_id
    JOIN orders o ON o.order_id = oi.order_id
    WHERE o.shop_id = 'US' AND o.deleted_at IS NULL
      AND (o.created_at AT TIME ZONE 'America/Los_Angeles')::date BETWEEN '2026-09-01' AND '2026-09-30'
  reference_mql: {metrics: [refund_amount], filters: {shop: [US]}, time: {range: custom, start: 2026-09-01, end: 2026-09-30}}

