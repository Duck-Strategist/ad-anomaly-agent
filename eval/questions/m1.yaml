# ============================== 对比 / 环比 ==============================
# 标准答案给出本期和上期两列（变化率可由两者推出，不单独比对）

- id: C01
  category: compare
  user_id: u_admin
  question: 美国店本周的 ROAS 和上周比怎么样？
  expect: rows
  gold_sql: |
    SELECT SUM(ad_sales) FILTER (WHERE stat_date >= '2026-11-02') / SUM(spend) FILTER (WHERE stat_date >= '2026-11-02') AS roas_cur,
           SUM(ad_sales) FILTER (WHERE stat_date <  '2026-11-02') / SUM(spend) FILTER (WHERE stat_date <  '2026-11-02') AS roas_prev
    FROM ad_daily_stats WHERE ad_group_id LIKE 'US-%' AND stat_date BETWEEN '2026-10-26' AND '2026-11-08'
  reference_mql: {metrics: [roas], filters: {shop: [US]}, time: {range: this_week, compare: previous_period}}

