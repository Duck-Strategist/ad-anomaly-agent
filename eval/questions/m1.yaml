# ============================== 陷阱题 ==============================
# 每题注明它考的陷阱。订单侧一律：排除软删除、按店铺本地日期切日、金额按下单当天汇率折合美元、退款归属到下单日。

- id: T01
  category: trap
  trap: soft_delete
  user_id: u_admin
  question: 上周美国店一共有多少个订单？
  expect: rows
  gold_sql: |
    SELECT COUNT(*) AS order_count FROM orders
    WHERE shop_id = 'US' AND deleted_at IS NULL
      AND (created_at AT TIME ZONE 'America/Los_Angeles')::date BETWEEN '2026-10-26' AND '2026-11-01'
  reference_mql: {metrics: [order_count], filters: {shop: [US]}, time: {range: last_week}}

- id: T02
  category: trap
  trap: soft_delete
  user_id: u_admin
  question: 最近 30 天日本店 SKU JP-SKU03 有多少个订单？
  expect: rows
  gold_sql: |
    SELECT COUNT(DISTINCT o.order_id) AS order_count
    FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
    WHERE oi.sku_id = 'JP-SKU03' AND o.deleted_at IS NULL
      AND (o.created_at AT TIME ZONE 'Asia/Tokyo')::date BETWEEN '2026-10-10' AND '2026-11-08'
  reference_mql: {metrics: [order_count], filters: {sku: [JP-SKU03]}, time: {range: last_30_days}}

- id: T03
  category: trap
  trap: soft_delete
  user_id: u_ops_us
  question: 10 月份美国店的订单客单价是多少？
  expect: rows
  gold_sql: |
    SELECT SUM(oi.qty * oi.unit_price) / COUNT(DISTINCT o.order_id) AS aov
    FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
    WHERE o.shop_id = 'US' AND o.deleted_at IS NULL
      AND (o.created_at AT TIME ZONE 'America/Los_Angeles')::date BETWEEN '2026-10-01' AND '2026-10-31'
  reference_mql: {metrics: [aov], filters: {shop: [US]}, time: {range: custom, start: 2026-10-01, end: 2026-10-31}}

- id: T04
  category: trap
  trap: currency
  user_id: u_admin
  question: 上周三家店的广告花费合计折合多少美元？
  expect: rows
  gold_sql: |
    SELECT SUM(s.spend * fx.rate_to_usd) AS ad_spend_usd
    FROM ad_daily_stats s
    JOIN shops sh ON sh.shop_id = split_part(s.ad_group_id, '-', 1)
    JOIN fx_rates fx ON fx.rate_date = s.stat_date AND fx.currency = sh.currency
    WHERE s.stat_date BETWEEN '2026-10-26' AND '2026-11-01'
  reference_mql: {metrics: [ad_spend], time: {range: last_week}}

- id: T05
  category: trap
  trap: currency
  user_id: u_admin
  question: 9 月份每家店的订单销售额分别折合多少美元？
  expect: rows
  gold_sql: |
    SELECT o.shop_id, SUM(oi.qty * oi.unit_price * fx.rate_to_usd) AS gross_sales_usd
    FROM orders o
    JOIN shops sh ON sh.shop_id = o.shop_id
    JOIN order_items oi ON oi.order_id = o.order_id
    JOIN fx_rates fx ON fx.currency = sh.currency
                    AND fx.rate_date = (o.created_at AT TIME ZONE sh.timezone)::date
    WHERE o.deleted_at IS NULL
      AND (o.created_at AT TIME ZONE sh.timezone)::date BETWEEN '2026-09-01' AND '2026-09-30'
    GROUP BY o.shop_id
  reference_mql: {metrics: [gross_sales], dimensions: [shop], time: {range: custom, start: 2026-09-01, end: 2026-09-30}}

