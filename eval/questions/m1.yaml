# M1 评测题（40 道）：单指标 12、对比 10、陷阱 12、越权 6
#
# 字段：
#   id / category / trap / user_id / question
#   expect:        rows（返回数据）| refuse（必须拒绝）| allowed_or_refuse（只能返回有权限店铺的数据，或拒绝）
#   gold_sql:      独立手写的标准答案 SQL（不经过编译器）。金额统一折合美元；"今天" = 2026-11-08（店铺本地日期）
#   reference_mql: 仅用于在接入模型之前核对编译器和标准答案是否一致，**不提供给任何模型**
#
# 时间约定：本周 = 最近 7 天 = 11-02..11-08；上周 = 10-26..11-01；最近 14 天 = 10-26..11-08；最近 30 天 = 10-10..11-08
#
# 审核状态：AI 起草，待人工审核（陷阱题 T01–T12、越权题 P01–P06 需逐行审核）

# ============================== 单指标 ==============================
- id: S01
  category: single
  user_id: u_admin
  question: 上周美国店的广告花费是多少？
  expect: rows
  gold_sql: |
    SELECT SUM(spend) AS ad_spend FROM ad_daily_stats
    WHERE ad_group_id LIKE 'US-%' AND stat_date BETWEEN '2026-10-26' AND '2026-11-01'
  reference_mql: {metrics: [ad_spend], filters: {shop: [US]}, time: {range: last_week}}

